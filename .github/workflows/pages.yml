name: Deploy a GitHub Pages

# El mismo repo sigue desplegándose en Railway (Express); GitHub Pages publica
# la versión estática del sitio en https://jesus1942.github.io/portfolio/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio estático
        run: |
          mkdir _site
          cp *.html *.css *.js *.json *.png *.webp robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp -r icons _site/
          # no publicar el server ni los scripts de generación
          rm -f _site/server.js _site/tailwind.config.js _site/gen-*.mjs _site/package*.json
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
